<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>德州扑克</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-left">
          <h1>德州扑克</h1>
          <span id="connectionStatus" class="conn-badge">连接中...</span>
        </div>
        <button id="leaveTableBtn" class="ghost hidden" type="button">返回大厅</button>
      </header>

      <!-- Hand End Summary Modal -->
      <div id="handEndModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>本局结束</h3>
            <button class="modal-close" type="button">&times;</button>
          </div>
          <div class="modal-body">
            <div id="modalResults"></div>
          </div>
          <div class="modal-footer">
            <button id="peekTableBtn" class="ghost" type="button">切到台面</button>
            <button id="nextHandBtn" class="start-btn" type="button">开始下一局</button>
          </div>
        </div>
      </div>

      <!-- 结算弹窗收起后，顶部居中的「查看结算」悬浮入口 -->
      <button id="handEndFab" class="hand-end-fab hidden" type="button">📋 查看结算</button>

      <!-- Settlement Report Modal -->
      <div id="settlementModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>房间结算</h3>
            <button class="modal-close" type="button">&times;</button>
          </div>
          <div class="modal-body">
            <div id="settlementResults"></div>
          </div>
          <div class="modal-footer">
            <button id="copyReportBtn" class="secondary" type="button">📋 复制战报</button>
            <button id="settlementOkBtn" class="start-btn" type="button">确定</button>
          </div>
        </div>
      </div>

      <!-- Hand History Modal -->
      <div id="historyModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>牌局历史</h3>
            <button class="modal-close" type="button">&times;</button>
          </div>
          <div class="modal-body">
            <div id="historyContent" class="history-list"></div>
          </div>
        </div>
      </div>

      <!-- Toast 提示（业务消息，与连接状态分离） -->
      <div id="toast" class="toast hidden"></div>

      <main>
        <!-- ===== 大厅页面 ===== -->
        <section id="lobbyView" class="view lobby">
          <div class="panel setup-panel">
            <h2 class="panel-heading">创建 / 加入房间</h2>
            <div class="field-row">
              <label>
                玩家名
                <input id="playerName" maxlength="18" placeholder="输入昵称">
              </label>
              <label>
                房间码
                <input id="roomCode" maxlength="6" placeholder="ABC123">
              </label>
            </div>
            <div class="field-row config-row">
              <label>
                小盲
                <input id="smallBlind" type="number" min="1" value="10">
              </label>
              <label>
                大盲
                <input id="bigBlind" type="number" min="2" value="20">
              </label>
              <label>
                起始筹码
                <input id="startingStack" type="number" min="100" value="2000">
              </label>
              <label>
                座位
                <input id="maxSeats" type="number" min="2" max="9" value="9">
              </label>
              <label>
                行动时限(秒)
                <input id="actionTimeout" type="number" min="5" max="120" step="1" value="30">
              </label>
            </div>
            <div class="button-row">
              <button id="createRoomBtn" class="start-btn" type="button">创建房间</button>
              <button id="joinRoomBtn" class="secondary" type="button">加入房间</button>
            </div>
            <p id="lobbyError" class="error"></p>
          </div>

          <div class="panel room-list-panel">
            <div class="panel-title">
              <h2>房间列表</h2>
              <button id="refreshRoomsBtn" class="ghost" type="button">刷新</button>
            </div>
            <div id="roomList" class="room-list"></div>
            <p id="roomListEmpty" class="room-list-empty hidden">暂无房间，创建一个吧</p>
          </div>
        </section>

        <!-- ===== 牌桌页面 ===== -->
        <section id="tableView" class="view table-view hidden">
          <div class="table-header">
            <div class="table-header-info">
              <span id="roomCodeBadge" class="badge"></span>
              <h2 id="roomName"></h2>
            </div>
            <div class="header-actions">
              <div class="header-secondary" id="headerSecondary">
                <div class="bot-controls">
                  <select id="botLevelSelect">
                    <option value="beginner">初级机器人</option>
                    <option value="intermediate">中级机器人</option>
                    <option value="advanced">高级机器人</option>
                  </select>
                  <button id="addBotBtn" class="ghost" type="button">添加机器人</button>
                </div>
                <button id="standBtn" class="ghost" type="button">离座</button>
                <button id="resumeBtn" class="secondary" type="button">重新入局</button>
                <button id="rebuyBtn" class="secondary" type="button">补充筹码</button>
                <button id="historyBtn" class="ghost" type="button">牌局历史</button>
                <button id="settleBtn" class="secondary" type="button">结算房间</button>
              </div>
              <button id="soundToggleBtn" class="ghost sound-toggle-btn" type="button" aria-label="音效开关" title="音效开关">🔊</button>
              <button id="moreBtn" class="ghost header-more-btn" type="button" aria-label="更多操作">&#8943;</button>
              <button id="startHandBtn" class="start-btn" type="button">开始下一局</button>
            </div>
          </div>

          <div class="member-panel">
            <div class="member-panel-title">房间成员</div>
            <div id="memberList" class="member-list"></div>
          </div>

          <!-- 牌桌区域（占满宽度） -->
          <div class="table-surface">
            <div id="seatGrid" class="seat-grid"></div>
            <div class="felt">
              <div id="dealerMessage" class="dealer-message"></div>
              <div id="board" class="board"></div>
              <div id="pot" class="pot"></div>
            </div>
          </div>

          <!-- 底部操作栏（固定在底部） -->
          <div class="bottom-bar">
            <div class="bottom-bar-hand">
              <span class="bottom-bar-label">我的手牌</span>
              <div id="viewerCards" class="viewer-cards"></div>
              <button id="peekCardsBtn" class="peek-btn" type="button">查看</button>
            </div>
            <div class="bottom-bar-actions">
              <div id="actionPanel" class="action-panel"></div>
            </div>
            <div class="bottom-bar-log">
              <button id="logToggleBtn" class="log-toggle-btn" type="button">行动日志 ▾</button>
              <div id="actionLogWrap" class="action-log-wrap hidden">
                <div id="actionLog" class="action-log"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
